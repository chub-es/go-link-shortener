services:
  postgres:
    container_name: postgres
    image: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: /run/secrets/db_password
      POSTGRES_DB: 'linkShortener'
    ports:
      - 5432:5432

  app:
    build:
      context: .
      target: final
    ports:
      - ${HTTP_PORT}:${HTTP_PORT}
    depends_on:
      - postgres
    env_file:
      - .env

  integration:
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    container_name: integration
    image: integration
    depends_on:
      - app

volumes:
  pg-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt